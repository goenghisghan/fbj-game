name: FPL Live Update

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  update-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - run: pip install requests
      - name: Update bootstrap + live GW stats
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'EOF'
          import os, requests, json, sys

          GIST_ID, GIST_TOKEN = os.environ["GIST_ID"], os.environ["GIST_TOKEN"]
          headers = {"User-Agent": "Mozilla/5.0"}
          gist_url = f"https://api.github.com/gists/{GIST_ID}"
          gh_headers = {"Authorization": f"Bearer {GIST_TOKEN}"}

          def load_gist_json(gist_id, gh_headers):
              gist_url = f"https://api.github.com/gists/{gist_id}"
              r = requests.get(gist_url, headers=gh_headers, timeout=30)
              r.raise_for_status()
              gist = r.json()
              file_info = gist["files"]["fpl_stats.json"]

              if file_info.get("truncated"):
                  raw_url = file_info["raw_url"]
                  rr = requests.get(raw_url, headers=gh_headers, timeout=60)
                  rr.raise_for_status()
                  return rr.json()
              else:
                  return json.loads(file_info["content"])

          def build_bps_by_fixture(fixtures):
              """{fixture_id: {player_id: bps}} — the live event/.../live/
              endpoint's `explain` block only carries the identifiers that
              directly explain points (minutes, goals, cards, etc.); bps
              isn't one of them, so it's never present there. The fixtures
              endpoint reports it separately, genuinely broken out per
              fixture (not just a GW total), which is what actually makes
              it possible to get bps right on a double gameweek."""
              out = {}
              for fx in fixtures:
                  fid = fx.get("id")
                  for stat in fx.get("stats", []):
                      if stat.get("identifier") != "bps":
                          continue
                      for side in ("h", "a"):
                          for entry in stat.get(side, []):
                              pid = entry.get("element")
                              if pid is not None:
                                  out.setdefault(fid, {})[pid] = entry.get("value", 0)
              return out

          def build_fixture_stats(player, bps_by_fixture):
              explain = player.get("explain", [])
              top = player.get("stats", {}) or {}
              # expected_goals/assists/goals_conceded aren't broken out per
              # fixture anywhere in the public API — only a GW-total is
              # available. Safe to attach to the single fixture when
              # there's only one this GW; on a genuine double gameweek
              # there's no way to split it, so leave it off rather than
              # guess (and risk fatzone's per-GW totals, which sum across
              # fixture rows, double-counting a GW-total value).
              xstat_keys = ("expected_goals", "expected_assists", "expected_goals_conceded")
              if not explain:
                  return [top]
              result = []
              for entry in explain:
                  fid = entry.get("fixture")
                  per_fixture = {"fixture": fid}
                  for stat in entry.get("stats", []):
                      identifier = stat.get("identifier")
                      if identifier:
                          per_fixture[identifier] = stat.get("value", 0)
                  bps = bps_by_fixture.get(fid, {}).get(player.get("id"))
                  if bps is not None:
                      per_fixture["bps"] = bps
                  result.append(per_fixture)
              if len(result) == 1:
                  for key in xstat_keys:
                      if key in top:
                          result[0][key] = top[key]
              return result

          # ---------------- Load existing stats ----------------
          stats = load_gist_json(GIST_ID, gh_headers)

          # ---------------- Fetch bootstrap ----------------
          r = requests.get("https://fantasy.premierleague.com/api/bootstrap-static/", headers=headers, timeout=30)
          if r.status_code != 200:
              print(f"⚠️ Bootstrap fetch failed ({r.status_code}), skipping update")
              sys.exit(0)
          try:
              bootstrap = r.json()
          except Exception:
              print("⚠️ Invalid JSON for bootstrap, skipping update")
              sys.exit(0)

          # Always stage the fresh bootstrap — this is what carries selected_by_percent,
          # prices, news, etc. It must not be gated behind "is there a current GW",
          # since during preseason/off-season there is no current GW at all and this
          # data would otherwise never get written back to the gist.
          stats["bootstrap"] = bootstrap

          # ---------------- Current GW (optional — only needed for live stats) ----------------
          current_event = next((e for e in bootstrap["events"] if e.get("is_current")), None)

          if current_event:
              gw_id = current_event["id"]
              r = requests.get(f"https://fantasy.premierleague.com/api/event/{gw_id}/live/", headers=headers, timeout=30)
              if r.status_code != 200:
                  print(f"⚠️ Live GW fetch failed ({r.status_code}), keeping previous live stats")
              else:
                  try:
                      live = r.json()

                      # Per-fixture bps (see build_bps_by_fixture) — best effort,
                      # falls back to no bps rather than blocking the rest of
                      # the update if this particular fetch has a problem.
                      bps_by_fixture = {}
                      try:
                          fr = requests.get(
                              "https://fantasy.premierleague.com/api/fixtures/",
                              params={"event": gw_id}, headers=headers, timeout=30,
                          )
                          if fr.status_code == 200:
                              bps_by_fixture = build_bps_by_fixture(fr.json())
                          else:
                              print(f"⚠️ Fixtures fetch for bps failed ({fr.status_code}), leaving bps as-is")
                      except Exception:
                          print("⚠️ Invalid JSON fetching fixtures for bps, leaving bps as-is")

                      stats.setdefault("stats", {})
                      stats["stats"][str(gw_id)] = {
                          str(p["id"]): build_fixture_stats(p, bps_by_fixture)
                          for p in live.get("elements", [])
                      }
                  except Exception:
                      print("⚠️ Invalid JSON for live GW, keeping previous live stats")
          else:
              print("ℹ️ No current GW (preseason/off-season) — updating bootstrap only")

          # ---------------- Validate before writing ----------------
          try:
              json.dumps(stats)  # make sure it's serializable
          except Exception as e:
              print(f"⚠️ Skipping update, invalid JSON: {e}")
              sys.exit(0)

          payload = {"files": {"fpl_stats.json": {"content": json.dumps(stats, indent=2)}}}
          resp = requests.patch(gist_url, headers=gh_headers, json=payload, timeout=60)
          resp.raise_for_status()

          if current_event:
              print(f"✅ Updated bootstrap + GW {gw_id} stats")
          else:
              print("✅ Updated bootstrap (no current GW)")
          EOF
